# /etc/nginx/conf.d/nvb.conf - HTTPS reverse proxy for the NVB demo app.
# Replace nvb.example.internal with the VM's DNS name and point the certificate
# paths at your internal-CA or self-signed certificate (see VM_DEPLOYMENT.md).

upstream nvb_app {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name nvb.example.internal;
    # Redirect all plain-HTTP traffic to HTTPS.
    return 301 https://$host$request_uri;
}

server {
    # `listen ... ssl http2` works on the nginx 1.20-1.24 builds shipped with
    # RHEL 9; on nginx >= 1.25.1 you may switch to the `http2 on;` directive.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nvb.example.internal;

    ssl_certificate     /etc/pki/nginx/nvb.crt;
    ssl_certificate_key /etc/pki/nginx/private/nvb.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    client_max_body_size 64k;
    server_tokens off;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;

    # Prometheus metrics: loopback and the monitoring host only.
    location = /metrics {
        allow 127.0.0.1;
        # allow 192.0.2.10;   # your Prometheus server
        deny all;
        proxy_pass http://nvb_app;
    }

    location / {
        proxy_pass http://nvb_app;
    }
}
