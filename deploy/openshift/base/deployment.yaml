apiVersion: apps/v1
kind: Deployment
metadata:
  name: nvb-app
  labels:
    app.kubernetes.io/component: web
spec:
  # Starting point; the HPA owns the replica count once it exists.
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: nvb-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: nvb-app
        app.kubernetes.io/name: nvb
        app.kubernetes.io/component: web
        nvb.demo/db-client: "true"   # allows DNS + PostgreSQL egress (networkpolicy.yaml)
    spec:
      serviceAccountName: nvb-app
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
        # No runAsUser / fsGroup: OpenShift's restricted-v2 SCC assigns an
        # arbitrary UID from the namespace range; the image supports that.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: nvb-app
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: nvb-app
      containers:
        - name: app
          image: nvb-app:1.0.0   # replaced by the overlay's `images:` entry
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: nvb-config
            - secretRef:
                name: nvb-secrets   # create from secret.example.yaml - not in git
          env:
            - name: NVB_INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NVB_APP_VERSION
              value: "1.0.0"
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 2
            failureThreshold: 30
            timeoutSeconds: 2
          readinessProbe:
            # Includes a short DB check - an unready pod is removed from the
            # Service but NOT restarted.
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 4
            failureThreshold: 3
          livenessProbe:
            # Process-only check; a database outage must not restart pods.
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          lifecycle:
            preStop:
              # Give the router time to stop sending traffic before SIGTERM.
              exec:
                command: ["sleep", "5"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
