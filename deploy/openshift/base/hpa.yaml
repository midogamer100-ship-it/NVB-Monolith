# Starting values - validate and tune against measured results.
# CPU utilisation is measured against the 500m REQUEST, so 60% ~= 300m per pod.
# Only appropriate when the measured bottleneck is application CPU
# (see docs/SCALING_DEMO.md).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nvb-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nvb-app
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      selectPolicy: Max
      policies:
        - type: Pods
          value: 2
          periodSeconds: 30
        - type: Percent
          value: 100
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300
      selectPolicy: Min
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
