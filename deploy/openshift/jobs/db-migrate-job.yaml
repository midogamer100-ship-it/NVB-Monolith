# Explicit, single database-migration operation. NOT part of any kustomization
# and NOT an initContainer, so replicas never race to migrate at startup.
# The CLI additionally takes a PostgreSQL advisory lock.
#
#   IMAGE=image-registry.openshift-image-registry.svc:5000/<ns>/nvb-app:1.0.0
#   sed "s|NVB_IMAGE|${IMAGE}|" deploy/openshift/jobs/db-migrate-job.yaml | oc create -n <ns> -f -
#   oc wait --for=condition=complete job/nvb-db-migrate -n <ns> --timeout=300s
#   oc logs job/nvb-db-migrate -n <ns>
#   oc delete job nvb-db-migrate -n <ns>     # before running it again
apiVersion: batch/v1
kind: Job
metadata:
  name: nvb-db-migrate
  labels:
    app.kubernetes.io/name: nvb
    app.kubernetes.io/component: db-migrate
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nvb
        app.kubernetes.io/component: db-migrate
        nvb.demo/db-client: "true"
    spec:
      restartPolicy: Never
      serviceAccountName: nvb-app
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: NVB_IMAGE
          command: ["python", "-m", "app.cli", "migrate"]
          envFrom:
            - configMapRef:
                name: nvb-config
            - secretRef:
                name: nvb-secrets
            - secretRef:
                name: nvb-migration-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
