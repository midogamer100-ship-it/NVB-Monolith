name: Approved internal Gateway build

on:
  push:
    branches: [feature/safe-core-ci]
    paths: [.github/workflows/internal-gateway-build.yml]

permissions:
  contents: read

concurrency:
  group: nvb-internal-build
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'midogamer100-ship-it/NVB-Monolith' && github.ref == 'refs/heads/feature/safe-core-ci'
    environment: nvb-ci-build
    runs-on: [self-hosted, Linux, X64, nvb-lan]
    timeout-minutes: 40
    steps:
      - name: Build fixed Gateway candidate without deployment
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/usr/local/bin:/usr/bin:/bin:$PATH"
          /usr/bin/python3 /usr/local/libexec/nvb-ci/run-gateway-build.py
