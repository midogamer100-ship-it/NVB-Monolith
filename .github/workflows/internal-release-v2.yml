name: Approved CI-proven paired candidate builds

on:
  push:
    branches: [feature/safe-core-ci]
    paths:
      - .github/workflows/internal-release-v2.yml
      - .nvb/releases/test-candidate.json

permissions:
  contents: read

concurrency:
  group: nvb-internal-build
  cancel-in-progress: false

jobs:
  candidates:
    if: github.repository == 'midogamer100-ship-it/NVB-Monolith' && github.ref == 'refs/heads/feature/safe-core-ci'
    environment: nvb-ci-build
    runs-on: [self-hosted, Linux, X64, nvb-lan]
    timeout-minutes: 180
    steps:
      - name: Build approved source commits after checking their exact CI runs
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/usr/local/bin:/usr/bin:/bin:$PATH"
          /usr/bin/python3 /usr/local/libexec/nvb-ci/run-release-v2.py
      - name: Save candidate provenance only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nvb-candidate-v2-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nvb-candidate-bundle-v2.json
          if-no-files-found: warn
          retention-days: 30
