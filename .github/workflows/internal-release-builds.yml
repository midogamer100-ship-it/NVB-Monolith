name: Approved Core and Digital candidate builds

on:
  push:
    branches: [feature/safe-core-ci]
    paths: [.github/workflows/internal-release-builds.yml]

permissions:
  contents: read

concurrency:
  group: nvb-internal-build
  cancel-in-progress: false

jobs:
  candidates:
    if: github.repository == 'midogamer100-ship-it/NVB-Monolith' && github.ref == 'refs/heads/feature/safe-core-ci'
    environment: nvb-ci-build
    runs-on: [self-hosted, Linux, X64, nvb-lan]
    timeout-minutes: 180
    steps:
      - name: Build or reuse fixed paired candidates
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/usr/local/bin:/usr/bin:/bin:$PATH"
          /usr/bin/python3 /usr/local/libexec/nvb-ci/run-release-builds.py
      - name: Save candidate metadata only
        if: always()
        # actions/upload-artifact v4.6.2, verified against its official release link.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nvb-candidate-bundle-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nvb-candidate-bundle.json
          if-no-files-found: warn
          retention-days: 30
